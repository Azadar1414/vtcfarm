*{box-sizing:border-box;margin:0;padding:0}

::selection{background:var(--amber);color:#1A1300}

.bg-grid{position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px, var(--hairline) 1px, transparent 0);background-size:36px 36px;opacity:.4;pointer-events:none}

.logo{font-family:var(--FDX);font-weight:700;font-size:1.3rem;margin-bottom:3rem;position:relative;z-index:1;display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--white);transition:opacity .2s}
.logo:hover{opacity:.8}
.logo .mark{width:10px;height:10px;background:var(--amber);box-shadow:0 0 12px var(--amber-glow);transition:transform .3s cubic-bezier(0.34,1.56,0.64,1)}
.logo:hover .mark{transform:rotate(45deg) scale(1.1)}

.id-tag{font-family:var(--FM);font-size:.73rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--dim);margin-bottom:1rem;position:relative;z-index:1}

.code{font-family:var(--FDX);font-size:clamp(5rem,15vw,10rem);font-weight:700;line-height:1;position:relative;z-index:1;letter-spacing:-.02em;background:var(--grad-amber);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

.title{font-family:var(--FDX);font-size:1.4rem;font-weight:700;margin-top:1.5rem;position:relative;z-index:1;color:var(--white)}

.desc{color:var(--muted);font-size:.94rem;margin-top:.85rem;max-width:440px;line-height:1.75;position:relative;z-index:1}

.btns{display:flex;gap:1rem;margin-top:2.5rem;flex-wrap:wrap;justify-content:center;position:relative;z-index:1}

.btn-a{
  background:var(--grad-amber);color:#1A1300;
  padding:15px 28px;font-weight:700;font-size:.85rem;
  font-family:var(--FB);text-decoration:none;display:inline-flex;align-items:center;gap:10px;
  transition:all .3s var(--ease);border:none;border-radius:var(--r);
  box-shadow:0 8px 30px rgba(232,163,61,0.15);position:relative;overflow:hidden
}
.btn-a::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.25),transparent 50%);opacity:0;transition:opacity .3s}
.btn-a:hover{transform:translateY(-3px);box-shadow:0 12px 36px rgba(232,163,61,0.25)}
.btn-a:hover::before{opacity:1}

.btn-o{
  background:transparent;color:var(--white);padding:15px 28px;
  border:1px solid var(--steel);font-weight:600;font-size:.85rem;
  font-family:var(--FB);text-decoration:none;transition:all .25s;border-radius:var(--r)
}
.btn-o:hover{border-color:var(--amber);color:var(--amber)}

.links{display:flex;gap:0;margin-top:3.5rem;flex-wrap:wrap;justify-content:center;position:relative;z-index:1;border:1px solid var(--hairline);border-radius:var(--r);overflow:hidden}
.links a{color:var(--muted);font-family:var(--FM);font-size:.76rem;text-decoration:none;transition:color .2s,background .2s;padding:13px 20px;border-right:1px solid var(--hairline)}
.links a:last-child{border-right:none}
.links a:hover{color:var(--amber);background:var(--bg2)}

@media(max-width:768px){
  .links{flex-direction:column}
  .links a{border-right:none;border-bottom:1px solid var(--hairline)}
  .links a:last-child{border-bottom:none}
}
